name: keep-alive

# Tiene svegli backend (Render) e database (Neon): entrambi sono su free tier
# e vanno in sleep dopo pochi minuti di inattività. Un ping periodico a
# /api/health (che tocca il DB) evita che un recruiter che apre il link
# aspetti 15-50s di cold start.
#
# NB: se cambia l'URL del servizio Render, aggiornarlo qui sotto.
# NB: le GitHub Actions schedulate vengono disattivate dopo 60 giorni senza
#     attività sul repo — basta un commit o un avvio manuale per riattivarle.

on:
  schedule:
    - cron: "*/10 * * * *"   # ogni 10 minuti (UTC); i tempi effettivi possono slittare
  workflow_dispatch: {}       # avvio manuale dalla tab Actions

# Se un run è ancora in corso (Render freddo, ping lento) non ne parte un altro
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          URL="https://rag-chatbot-0uwq.onrender.com/api/health"
          # Se Render è freddo il primo ping fa da sveglia e può metterci
          # 30-90s: max-time generoso + qualche tentativo. Non fallire per una
          # singola risposta lenta — solo se resta irraggiungibile.
          for attempt in 1 2 3 4; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --connect-timeout 25 --max-time 180 "$URL" || echo "000")
            echo "tentativo $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "ok, backend e DB svegli"
              exit 0
            fi
            sleep 25
          done
          echo "::warning::/api/health non ha risposto 200 dopo 4 tentativi (ultimo: $code)"
          exit 1
